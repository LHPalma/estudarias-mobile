name: CI

on:
  push:
    branches: [main]
  # Sem filtro de branches: o CI roda em todo pull request, seja qual for a base, como no back. Um PR empilhado, com a base na
  # branch de outro PR, também passa por lint, tipos e testes.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Um passo por verificação, para o vermelho apontar o que quebrou.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
